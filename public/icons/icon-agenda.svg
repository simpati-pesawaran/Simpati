<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="agendaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="agendaGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="agendaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="6" y="6" width="36" height="36" rx="10" fill="white" filter="url(#agendaShadow)"/>

  <!-- Calendar Header -->
  <rect x="6" y="6" width="36" height="12" rx="10" fill="url(#agendaGrad)"/>
  <rect x="6" y="14" width="36" height="4" fill="url(#agendaGrad)"/>

  <!-- Calendar Rings -->
  <rect x="13" y="3" width="4" height="8" rx="2" fill="#4F46E5"/>
  <rect x="22" y="3" width="4" height="8" rx="2" fill="#2563EB"/>
  <rect x="31" y="3" width="4" height="8" rx="2" fill="#7C3AED"/>

  <!-- Calendar Grid Lines -->
  <line x1="14" y1="24" x2="34" y2="24" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="30" x2="34" y2="30" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="21" x2="20" y2="33" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="21" x2="28" y2="33" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Highlighted Date -->
  <rect x="16" y="27" width="8" height="8" rx="2" fill="url(#agendaGrad)"/>

  <!-- Checkmark -->
  <path d="M18 31 L20 33 L24 29" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>