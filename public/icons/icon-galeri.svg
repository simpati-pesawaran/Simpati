<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="galeriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="galeriGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="galeriShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7C3AED" flood-opacity="0.25"/>
    </filter>
    <clipPath id="galeriClip">
      <rect x="8" y="8" width="32" height="32" rx="8"/>
    </clipPath>
  </defs>

  <!-- Background Card -->
  <rect x="6" y="6" width="36" height="36" rx="10" fill="white" filter="url(#galeriShadow)"/>

  <!-- Image Container -->
  <g clip-path="url(#galeriClip)">
    <!-- Background Gradient -->
    <rect x="8" y="8" width="32" height="32" fill="url(#galeriGrad)"/>

    <!-- Mountain Landscape -->
    <path d="M8 32 L18 20 L26 28 L34 16 L40 32 Z" fill="white" fill-opacity="0.3"/>
    <path d="M8 32 L14 24 L22 32 Z" fill="white" fill-opacity="0.2"/>

    <!-- Sun -->
    <circle cx="32" cy="14" r="4" fill="#FBBF24"/>
    <circle cx="32" cy="14" r="3" fill="#FDE68A"/>
  </g>

  <!-- Frame Border -->
  <rect x="8" y="8" width="32" height="32" rx="8" stroke="white" stroke-width="1.5" fill="none"/>

  <!-- Gallery Indicator Dots -->
  <circle cx="14" cy="14" r="2" fill="white" fill-opacity="0.8"/>
  <circle cx="20" cy="14" r="2" fill="white" fill-opacity="0.5"/>
  <circle cx="26" cy="14" r="2" fill="white" fill-opacity="0.3"/>

  <!-- Photo Count Badge -->
  <circle cx="38" cy="36" r="7" fill="white" filter="url(#galeriShadow)"/>
  <text x="38" y="39" text-anchor="middle" fill="url(#galeriGrad)" font-size="7" font-weight="700" font-family="system-ui">12</text>
</svg>